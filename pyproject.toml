[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitcycle"
version = "0.1.0"
description = "Unofficial open implementation of Recycler (hidden-state recycling) for 1.58-bit LLMs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=5.0"]

[project.optional-dependencies]
test = ["pytest"]
eval = ["lm-eval>=0.4.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
